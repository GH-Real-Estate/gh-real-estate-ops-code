name: Legal Release Checks

on:
  pull_request:
    paths:
      - 'legal/**'
      - '.github/workflows/legal-*.yml'
  push:
    branches:
      - main
    paths:
      - 'legal/**'
      - '.github/workflows/legal-*.yml'

permissions:
  contents: read

jobs:
  validate-legal-release:
    name: Validate legal source release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install source monitor dependencies
        run: python -m pip install --requirement legal/requirements-source-monitor.txt

      - name: Validate manifests, hashes, PDFs, and searchable text
        run: python legal/scripts/validate_release.py

      - name: Run legal source monitor regression tests
        run: python -m unittest discover -s legal/tests -p 'test_*.py'
