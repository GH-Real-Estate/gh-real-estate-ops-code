name: Repo Checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  safety-scan:
    name: Safety scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run repository safety scan
        run: python tools/safety/pre-commit-safety-check.py

  zillow-lead-intake:
    name: Zillow lead intake checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/zoho-crm/integrations/zillow-lead-intake
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Zillow intake checks
        run: npm run ci

  returned-fee-webhook:
    name: Returned fee webhook checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/zoho-payments/webhooks/returned-payment-fee
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: src/zoho-payments/webhooks/returned-payment-fee/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run webhook checks
        run: npm run ci
