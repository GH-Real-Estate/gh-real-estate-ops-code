name: Repo Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  safety-scan:
    name: Safety scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Run repository safety scan
        run: python tools/safety/pre-commit-safety-check.py

  zillow-lead-intake:
    name: Zillow lead intake checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/zoho-crm/integrations/zillow-lead-intake
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'

      - name: Run Zillow intake checks
        run: npm run ci

  returned-fee-webhook:
    name: Returned fee webhook checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/zoho-payments/webhooks/returned-payment-fee
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: src/zoho-payments/webhooks/returned-payment-fee/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run webhook checks
        run: npm run ci
