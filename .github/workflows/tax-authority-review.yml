name: Tax Authority Monitor and Semiannual Review

on:
  schedule:
    - cron: '23 14 15 1,7 *'
  workflow_dispatch:
    inputs:
      force_formal_review:
        description: Treat every registered source as due for formal review
        required: false
        type: boolean
        default: false

concurrency:
  group: tax-authority-review-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare-tax-authorities:
    name: Retrieve official sources and enforce the review calendar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      monitor_outcome: ${{ steps.review.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check official tax sources
        id: review
        continue-on-error: true
        shell: bash
        env:
          FORCE_FORMAL_REVIEW: ${{ inputs.force_formal_review }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: tax-authority-review-${{ github.run_id }}
        run: |
          args=()
          if [[ "$FORCE_FORMAL_REVIEW" == "true" ]]; then
            args+=(--formal-review)
          fi
          timeout --signal=TERM --kill-after=30s 20m \
            python accounting/scripts/check_tax_sources.py \
              "${args[@]}" \
              --json-report tax-authority-review.json \
              --markdown-report tax-authority-review.md \
              --issue-report tax-authority-review-issue.md \
              --workflow-run-url "$RUN_URL" \
              --artifact-name "$ARTIFACT_NAME"

      - name: Ensure failure reports exist
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: tax-authority-review-${{ github.run_id }}
        run: |
          if [[ ! -s tax-authority-review.json ]]; then
            printf '%s\n' '{"checked_at":null,"notice":"Workflow failed before report generation.","counts":{"unchanged":0,"changed":0,"error":1,"review-due":0,"manual-baseline":0,"delegated":0},"results":[]}' > tax-authority-review.json
          fi
          if [[ ! -s tax-authority-review.md ]]; then
            printf '%s\n' \
              '# Tax-authority monitor workflow failure' \
              '' \
              'The workflow failed before producing a complete report.' \
              '' \
              "- Workflow run: $RUN_URL" \
              "- Expected artifact: $ARTIFACT_NAME" \
              > tax-authority-review.md
          fi
          if [[ ! -s tax-authority-review-issue.md ]] || [[ $(wc -c < tax-authority-review-issue.md) -gt 60000 ]]; then
            printf '%s\n' \
              '# Tax-authority monitor workflow failure' \
              '' \
              'Treat the registered sources as unverified until this run is reviewed.' \
              '' \
              "- Workflow run: $RUN_URL" \
              "- Expected artifact: $ARTIFACT_NAME" \
              > tax-authority-review-issue.md
          fi

      - name: Upload tax review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-authority-review-${{ github.run_id }}
          path: |
            tax-authority-review.json
            tax-authority-review.md
            tax-authority-review-issue.md
          retention-days: 200
          if-no-files-found: error

      - name: Fail after preserving the report
        if: ${{ always() && steps.review.outcome == 'failure' }}
        run: exit 1

  publish-tax-review:
    name: Publish tax review issue
    needs: compare-tax-authorities
    if: >-
      ${{
        always() &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (
          needs.compare-tax-authorities.result == 'failure' ||
          needs.compare-tax-authorities.outputs.monitor_outcome == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Download tax review report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tax-authority-review-${{ github.run_id }}
          path: .

      - name: Ensure publishable issue summary exists
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: tax-authority-review-${{ github.run_id }}
        run: |
          if [[ ! -s tax-authority-review-issue.md ]] ||
            [[ $(wc -c < tax-authority-review-issue.md) -gt 60000 ]]; then
            printf '%s\n' \
              '# Tax-authority monitor workflow failure' \
              '' \
              'The comparison job failed and its report artifact could not be downloaded.' \
              '' \
              "- Workflow run: $RUN_URL" \
              "- Expected artifact: $ARTIFACT_NAME" \
              '' \
              '> Treat registered sources as unverified until this run is reviewed.' \
              > tax-authority-review-issue.md
          fi

      - name: Open or update tax-review issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='TAX REVIEW REQUIRED: sources changed, failed, are due, or need baselines'
          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$title in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file tax-authority-review-issue.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file tax-authority-review-issue.md
          fi
