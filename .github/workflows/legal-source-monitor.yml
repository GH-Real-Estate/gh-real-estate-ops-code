name: Legal Source Monitor

on:
  schedule:
    - cron: '27 12 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'legal/scripts/check_official_sources.py'
      - 'legal/manifests/source_monitor_overrides.json'
      - 'legal/manifests/authority_registry.json'
      - 'legal/requirements-source-monitor.txt'
      - 'legal/generated/project-sources/current/**'
      - 'legal/text/current/authorities/**'
      - '.github/workflows/legal-source-monitor.yml'

concurrency:
  group: legal-source-monitor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare-official-sources:
    name: Compare approved hashes with official sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      monitor_outcome: ${{ steps.monitor.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install source monitor dependencies
        run: python -m pip install --requirement legal/requirements-source-monitor.txt

      - name: Check official sources
        id: monitor
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=30s 15m \
            python legal/scripts/check_official_sources.py \
            --json-report legal-source-monitor.json \
            --markdown-report legal-source-monitor.md \
            --issue-report legal-source-monitor-issue.md \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact-name "legal-source-monitor-${{ github.run_id }}"

      - name: Ensure failure reports exist
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: legal-source-monitor-${{ github.run_id }}
        run: |
          if [[ ! -s legal-source-monitor.json ]]; then
            printf '%s\n' '{"checked_at":null,"notice":"Workflow failed before report generation.","counts":{"unchanged":0,"changed":0,"error":1,"manual":0},"results":[{"status":"error","citation":"Workflow execution","title":"Legal source monitor workflow","error":"Workflow failed before report generation."}]}' > legal-source-monitor.json
          fi
          if [[ ! -s legal-source-monitor.md ]]; then
            printf '%s\n' \
              '# Legal source monitor workflow failure' \
              '' \
              'The workflow failed before it produced a complete source-comparison report.' \
              '' \
              "- Workflow run: $RUN_URL" \
              "- Expected artifact: $ARTIFACT_NAME" \
              '' \
              '> Treat all monitored sources as unverified until this run is reviewed.' \
              > legal-source-monitor.md
          fi
          if [[ ! -s legal-source-monitor-issue.md ]] ||
            [[ $(wc -c < legal-source-monitor-issue.md) -gt 60000 ]]; then
            printf '%s\n' \
              '# Legal source monitor workflow failure' \
              '' \
              'The workflow did not produce a bounded issue summary.' \
              '' \
              "- Workflow run: $RUN_URL" \
              "- Full report artifact: $ARTIFACT_NAME" \
              '' \
              '> Treat all monitored sources as unverified until this run is reviewed.' \
              > legal-source-monitor-issue.md
          fi

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legal-source-monitor-${{ github.run_id }}
          path: |
            legal-source-monitor.json
            legal-source-monitor.md
            legal-source-monitor-issue.md
          retention-days: 90
          if-no-files-found: error

      - name: Fail after preserving report
        if: steps.monitor.outcome == 'failure'
        run: exit 1

  publish-legal-review:
    name: Publish legal review issue
    needs: compare-official-sources
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (
          needs.compare-official-sources.result == 'failure' ||
          needs.compare-official-sources.outputs.monitor_outcome == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Download monitor report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legal-source-monitor-${{ github.run_id }}
          path: .

      - name: Ensure publishable issue summary exists
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: legal-source-monitor-${{ github.run_id }}
        run: |
          if [[ ! -s legal-source-monitor-issue.md ]] ||
            [[ $(wc -c < legal-source-monitor-issue.md) -gt 60000 ]]; then
            printf '%s\n' \
              '# Legal source monitor workflow failure' \
              '' \
              'The comparison job failed and its report artifact could not be downloaded.' \
              '' \
              "- Workflow run: $RUN_URL" \
              "- Expected artifact: $ARTIFACT_NAME" \
              '' \
              '> Treat all monitored sources as unverified until this run is reviewed.' \
              > legal-source-monitor-issue.md
          fi

      - name: Open or update legal-review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='LEGAL REVIEW REQUIRED: official legal sources changed or could not be verified'
          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$title in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file legal-source-monitor-issue.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file legal-source-monitor-issue.md
          fi
