name: CRM Field Catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/zoho-crm/AGENTS.md'
      - 'src/zoho-crm/README.md'
      - 'src/zoho-crm/field-maps/crm-module-field-catalog.md'
      - 'src/zoho-crm/field-maps/production-module-*.csv'
      - 'src/zoho-crm/field-maps/crm-module-fields/**'
      - 'src/zoho-crm/field-maps/global-picklists/**'
      - 'src/zoho-crm/field-maps/protected-modules/**'
      - 'src/zoho-crm/standards/**'
      - 'src/zoho-crm/tests/**'
      - 'src/zoho-crm/tools/**'
      - '.github/workflows/crm-field-catalog.yml'
  push:
    branches:
      - main
    paths:
      - 'src/zoho-crm/AGENTS.md'
      - 'src/zoho-crm/README.md'
      - 'src/zoho-crm/field-maps/crm-module-field-catalog.md'
      - 'src/zoho-crm/field-maps/production-module-*.csv'
      - 'src/zoho-crm/field-maps/crm-module-fields/**'
      - 'src/zoho-crm/field-maps/global-picklists/**'
      - 'src/zoho-crm/field-maps/protected-modules/**'
      - 'src/zoho-crm/standards/**'
      - 'src/zoho-crm/tests/**'
      - 'src/zoho-crm/tools/**'
      - '.github/workflows/crm-field-catalog.yml'

permissions:
  contents: read

concurrency:
  group: crm-field-catalog-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate CRM field catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate governed CRM module and field catalog
        run: |
          python src/zoho-crm/tools/validate-crm-field-catalog.py
          python src/zoho-crm/tools/validate-protected-module-baselines.py
          python -m unittest discover -s src/zoho-crm/tests -p 'test_*.py'
          python -m py_compile \
            src/zoho-crm/tools/validate-crm-field-catalog.py \
            src/zoho-crm/tools/validate-protected-module-baselines.py \
            src/zoho-crm/tools/export-crm-metadata.py
