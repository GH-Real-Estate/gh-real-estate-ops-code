name: Accounting Authority Checks

on:
  pull_request:
    paths:
      - 'accounting/**'
      - '.github/workflows/accounting-*.yml'
  push:
    branches:
      - main
    paths:
      - 'accounting/**'
      - '.github/workflows/accounting-*.yml'

permissions:
  contents: read

jobs:
  validate-accounting-authority:
    name: Validate accounting authority registry and sourcebooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Validate registry, licensing controls, hashes, PDFs, and searchable text
        run: python accounting/scripts/validate_authority_registry.py

