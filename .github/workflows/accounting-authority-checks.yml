name: Accounting Authority Checks

on:
  pull_request:
    paths:
      - 'accounting/**'
      - '.github/workflows/accounting-*.yml'
  push:
    branches:
      - main
    paths:
      - 'accounting/**'
      - '.github/workflows/accounting-*.yml'

permissions:
  contents: read

concurrency:
  group: accounting-authority-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-accounting-authority:
    name: Validate accounting authority registry and sourcebooks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Validate registry, licensing controls, hashes, PDFs, and searchable text
        run: python accounting/scripts/validate_authority_registry.py

