name: Accounting Authority Checks

on:
  pull_request:
    paths:
      - 'accounting/**'
      - '.github/workflows/accounting-*.yml'
      - '.github/workflows/tax-authority-review.yml'
  push:
    branches:
      - main
    paths:
      - 'accounting/**'
      - '.github/workflows/accounting-*.yml'
      - '.github/workflows/tax-authority-review.yml'

permissions:
  contents: read

jobs:
  validate-accounting-authority:
    name: Validate accounting and tax authority registries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate accounting registry, licensing controls, hashes, PDFs, and searchable text
        run: python accounting/scripts/validate_authority_registry.py

      - name: Validate the focused tax-authority registry and sourcebook cross-references
        run: python accounting/scripts/check_tax_sources.py --validate-only

      - name: Test the report-only tax-authority monitor
        run: python -m unittest discover -s accounting/tests -p 'test_*.py'
