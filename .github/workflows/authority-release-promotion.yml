name: Authority Release Promotion

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Authority domain being promoted
        required: true
        type: choice
        options:
          - legal
          - accounting
      candidate_path:
        description: Immutable candidate under authority/candidates/<domain>/runs/<run-id>-<attempt>/candidate.json
        required: true
        type: string
      approval_path:
        description: Structured approval JSON under authority/reviews/<domain>/
        required: true
        type: string
      release_date:
        description: Release date in YYYY-MM-DD format
        required: true
        type: string
      confirmation:
        description: Type PROMOTE_REVIEWED_AUTHORITY_RELEASE exactly
        required: true
        type: string

concurrency:
  group: authority-release-promotion-${{ inputs.domain }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote-reviewed-evidence:
    name: Promote reviewed ${{ inputs.domain }} evidence
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: authority-production
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the default branch has not moved
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${DEFAULT_BRANCH}" | awk '{print $1}')"
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Default branch moved after this run was created; re-dispatch from current main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Block unresolved authority pull requests
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          open_prs="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1000 \
              --json number,headRefName,baseRefName,isCrossRepository,headRepositoryOwner,url \
              --jq '.[] | [.number, .headRefName, .baseRefName, .isCrossRepository, .headRepositoryOwner.login, .url] | @tsv'
          )"
          while IFS=$'\t' read -r number head_ref base_ref cross_repository head_owner url; do
            if [[ "$cross_repository" != 'false' ]] ||
              [[ "${head_owner,,}" != "${REPOSITORY_OWNER,,}" ]]; then
              continue
            fi
            if [[ "$head_ref" == "automation/authority-${DOMAIN}-candidate" ]] &&
              [[ "$base_ref" == "$DEFAULT_BRANCH" ]]; then
              echo "Discovery candidate PR #${number} is still open for ${DOMAIN}: ${url}" >&2
              echo 'Reconcile and merge or close it before promoting older evidence.' >&2
              exit 1
            fi
            if [[ "$head_ref" == "automation/authority-promotion-${DOMAIN}-"* ]]; then
              echo "Promotion PR #${number} is already open for ${DOMAIN}: ${url}" >&2
              echo 'Review, merge, or close it before dispatching another promotion.' >&2
              exit 1
            fi
          done <<< "$open_prs"

      - name: Validate protected promotion inputs
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
          RELEASE_DATE: ${{ inputs.release_date }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath

          domain = os.environ["DOMAIN"]
          candidate_raw = os.environ["CANDIDATE_PATH"]
          approval_raw = os.environ["APPROVAL_PATH"]
          confirmation = os.environ["CONFIRMATION"]

          if confirmation != "PROMOTE_REVIEWED_AUTHORITY_RELEASE":
              raise SystemExit("exact promotion confirmation is required")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", os.environ["RELEASE_DATE"]):
              raise SystemExit("release_date must use YYYY-MM-DD")

          def validate_path(raw, prefix, label):
              value = PurePosixPath(raw)
              if (
                  "\\" in raw
                  or value.is_absolute()
                  or ".." in value.parts
                  or value.suffix != ".json"
              ):
                  raise SystemExit(f"invalid {label} path")
              expected = PurePosixPath("authority") / prefix / domain
              try:
                  value.relative_to(expected)
              except ValueError as exc:
                  raise SystemExit(f"{label} must be under {expected}/") from exc
              path = Path(*value.parts)
              if not path.is_file():
                  raise SystemExit(f"{label} does not exist: {raw}")
              expected_root = (Path.cwd() / Path(*expected.parts)).resolve()
              try:
                  path.resolve(strict=True).relative_to(expected_root)
              except (OSError, ValueError) as exc:
                  raise SystemExit(f"{label} resolves outside {expected}/") from exc
              return path

          candidate_path = validate_path(candidate_raw, "candidates", "candidate")
          validate_path(approval_raw, "reviews", "approval")
          candidate_value = PurePosixPath(candidate_raw)
          candidate_runs = PurePosixPath("authority") / "candidates" / domain / "runs"
          try:
              candidate_relative = candidate_value.relative_to(candidate_runs)
          except ValueError as exc:
              raise SystemExit(f"candidate must be under {candidate_runs}/") from exc
          if (
              len(candidate_relative.parts) != 2
              or not re.fullmatch(r"\d+-\d+", candidate_relative.parts[0])
              or candidate_relative.parts[1] != "candidate.json"
          ):
              raise SystemExit(
                  "candidate must be an immutable runs/<run-id>-<attempt>/candidate.json"
              )
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          if candidate.get("domain") != domain:
              raise SystemExit("candidate domain does not match workflow input")
          if candidate.get("run_id") != candidate_relative.parts[0]:
              raise SystemExit("candidate run_id does not match its immutable run directory")
          PY

      - name: Validate candidate and structured approval without writing
        env:
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          python tools/authority_refresh/promotion.py \
            --candidate "$CANDIDATE_PATH" \
            --approval "$APPROVAL_PATH" \
            --release-date "$RELEASE_DATE" \
            --source-revision "$(git rev-parse HEAD)"

      - name: Require a clean source revision before context capture
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'Promotion validation changed the checked-out source revision.' >&2
            git status --short >&2
            exit 1
          fi

      - name: Generate immutable release evidence and reviewed snapshot
        env:
          DOMAIN: ${{ inputs.domain }}
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          result_file="$(mktemp)"
          trap 'rm -f "$result_file"' EXIT
          python tools/authority_refresh/promotion.py \
            --candidate "$CANDIDATE_PATH" \
            --approval "$APPROVAL_PATH" \
            --release-date "$RELEASE_DATE" \
            --source-revision "$(git rev-parse HEAD)" \
            --confirm 'PROMOTE_REVIEWED_AUTHORITY_RELEASE' \
            > "$result_file"
          PROMOTION_RESULT="$result_file" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          result = json.loads(Path(os.environ["PROMOTION_RESULT"]).read_text(encoding="utf-8"))
          release = result.get("release")
          if result.get("mode") != "promoted" or not isinstance(release, dict):
              raise SystemExit("promotion did not return a promoted release")

          domain = os.environ["DOMAIN"]
          release_date = os.environ["RELEASE_DATE"]
          release_id = release.get("release_id")
          if (
              release.get("domain") != domain
              or not isinstance(release_id, str)
              or not re.fullmatch(
                  rf"{re.escape(release_date)}-{re.escape(domain)}-[0-9a-f]{{12}}",
                  release_id,
              )
          ):
              raise SystemExit("promotion returned an invalid release identity")

          release_root = (Path.cwd() / "authority" / "releases").resolve()
          release_dir = Path("authority") / "releases" / release_id
          try:
              release_dir.resolve(strict=True).relative_to(release_root)
          except (OSError, ValueError) as exc:
              raise SystemExit("generated release resolves outside authority/releases") from exc
          expected = {
              "approval.json",
              "candidate.json",
              "release.json",
              "validation-context.json",
          }
          actual = {
              path.relative_to(release_dir).as_posix()
              for path in release_dir.rglob("*")
              if path.is_file()
          }
          if actual != expected or any(path.is_symlink() for path in release_dir.rglob("*")):
              raise SystemExit("generated release contains unexpected files or links")

          release_record = json.loads(
              (release_dir / "release.json").read_text(encoding="utf-8")
          )
          if (
              release_record.get("release_id") != release_id
              or release_record.get("domain") != domain
          ):
              raise SystemExit("generated release record does not match its directory")
          (Path(os.environ["RUNNER_TEMP"]) / "authority-promotion-release-id.txt").write_text(
              release_id + "\n", encoding="utf-8"
          )
          print(json.dumps({"mode": "promoted", "release_id": release_id}, sort_keys=True))
          PY

      - name: Open a promotion pull request without merging
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(tr -d '\r\n' < "$RUNNER_TEMP/authority-promotion-release-id.txt")"
          if [[ ! "$release_id" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-${DOMAIN}-[0-9a-f]{12}$ ]]; then
            echo 'Promotion release identity is missing or invalid.' >&2
            exit 1
          fi
          release_dir="authority/releases/${release_id}"
          snapshot="authority/snapshots/${DOMAIN}.json"
          git add \
            "${release_dir}/approval.json" \
            "${release_dir}/candidate.json" \
            "${release_dir}/release.json" \
            "${release_dir}/validation-context.json" \
            "$snapshot"

          changed="$(git diff --cached --name-only | sort)"
          expected="$(
            printf '%s\n' \
              "${release_dir}/approval.json" \
              "${release_dir}/candidate.json" \
              "${release_dir}/release.json" \
              "${release_dir}/validation-context.json" \
              "$snapshot" \
              | sort
          )"
          if [[ "$changed" != "$expected" ]]; then
            echo 'Promotion did not stage the exact expected release evidence set.' >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$changed" >&2
            exit 1
          fi
          unstaged="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unstaged" || -n "$untracked" ]]; then
            echo 'Promotion produced unexpected repository changes.' >&2
            printf 'Unstaged:\n%s\nUntracked:\n%s\n' "$unstaged" "$untracked" >&2
            exit 1
          fi

          branch="automation/authority-promotion-${DOMAIN}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(authority): promote reviewed ${DOMAIN} evidence"
          git push origin "$branch"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --draft \
            --title "Promote reviewed ${DOMAIN} authority evidence" \
            --body $'## Authority evidence promotion\n\nThis pull request was generated only after structured review validation and approval through the `authority-production` environment. It updates immutable review evidence and the discovery baseline. It does not certify legal or GAAP compliance and it is not merged automatically.'

          gh workflow run authority-refresh-checks.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$branch"
          gh workflow run repo-checks.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$branch"
